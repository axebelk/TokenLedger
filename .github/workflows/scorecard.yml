name: OpenSSF Scorecard

# Publishes a security-posture score (branch protection, pinned deps,
# dangerous workflow patterns, code review coverage, etc.) to the public
# Scorecard API — https://api.scorecard.dev — which is what backs the
# "OpenSSF Scorecard" badge in README.md. Read-only; doesn't fail CI.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3" # weekly — most Scorecard checks look at repo config, not code
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to api.scorecard.dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif